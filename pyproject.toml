[project]
name = "kdence"
version = "0.1.0"
description = "KDence — local, privacy-preserving activity tracker for KDE Plasma 6 on Wayland."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # dbus-fast is the ONLY runtime dependency, and adding a second one is a decision
    # rather than a convenience — see binding decision 2 in docs/documentation.md.
    # It hosts the local DBus receiver for the KWin focus script (the only reliable
    # egress from KWin's script sandbox) and is reused by the MPRIS detail source.
    # Everything else is stdlib: sqlite3, http.server, the Wayland idle wire client,
    # the systemd unit renderer, the soak sampler. ECharts and JetBrains Mono are
    # vendored static assets, not packages.
    "dbus-fast>=5.0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a live Wayland/KDE Plasma session (not for headless CI)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
